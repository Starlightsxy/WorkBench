server:
  port: 3000
spring:
  datasource: # mysql
    url: jdbc:mysql://localhost:3306/workbench?useUnicode=true&characterEncoding=utf-8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data: # redis
    redis:
      host: localhost
      port: 6379
      password: 123456
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  rabbitmq: # rabbitmq
    host: localhost
    port: 5672
    username: admin
    password: 123456
    virtual-host: /
# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html # 文档地址
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs # 指定 OpenAPI 规范 JSON 文档的访问路径。
  group-configs:
    - group: 'workApp'
      paths-to-match: '/**'
      packages-to-scan: com.work.bench
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-group: true
